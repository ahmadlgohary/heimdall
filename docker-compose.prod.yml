# Production-like stack: managed PostgreSQL (Neon), RabbitMQ (CloudAMQP) and S3-compatible
# storage all come from .env; nothing stateful runs here. One image (the root Dockerfile) serves the
# API and the web app from the same origin; it's the only thing published on the host.
#
#   docker compose -f docker-compose.prod.yml up -d --build      (or: make prod-up)

name: heimdall-prod

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
  image: heimdall:latest
  restart: always
  env_file: [.env]
  environment: &backend-env
    APP_ENV: production
    JSON_LOGS: "true"
    DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (Neon pooled URL)}
    RABBITMQ_URL: ${RABBITMQ_URL:?set RABBITMQ_URL (CloudAMQP amqps:// URL)}
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
    STORAGE_BACKEND: s3
    FRONTEND_DIST: /app/web # where the image puts the built app; ignore any local path from .env
    ALLOW_PRIVATE_DESTINATIONS: "false"
    # Public demo (plan §14.3): set DEMO_ENABLED=true and run `make prod-seed`. The worker reaches the
    # built-in receiver through the public URL (API_URL), which nginx forwards to the API.
    DEMO_ENABLED: ${DEMO_ENABLED:-false}
    DEMO_RECEIVER_ENABLED: ${DEMO_ENABLED:-false}
  networks: [internal]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true

  api:
    <<: *backend
    # the workers and migrations run as their own services here, so not the all-in-one start.sh
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    ports:
      - "${APP_PORT:-8000}:8000" # API + web app
    depends_on:
      migrate:
        condition: service_completed_successfully

  publisher:
    <<: *backend
    command: ["python", "-m", "app.workers.outbox_worker"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["python", "-m", "app.workers.delivery_worker"]
    healthcheck:
      disable: true
    deploy:
      replicas: ${WORKER_REPLICAS:-2} # workers scale independently of the API
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  internal:

# Production-like stack: managed PostgreSQL (Neon) and S3-compatible storage come from .env;
# RabbitMQ runs here with a persistent volume. One image (the root Dockerfile) serves the
# API and the web app from the same origin; it's the only thing published on the host.
#
#   docker compose -f docker-compose.prod.yml up -d --build      (or: make prod-up)

name: heimdall-prod

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
  image: heimdall:latest
  restart: always
  env_file: [.env]
  environment: &backend-env
    APP_ENV: production
    JSON_LOGS: "true"
    DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (Neon pooled URL)}
    RABBITMQ_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}@rabbitmq:5672/
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
    STORAGE_BACKEND: s3
    ALLOW_PRIVATE_DESTINATIONS: "false"
    # Public demo (plan §14.3): set DEMO_ENABLED=true and run `make prod-seed`. The worker reaches the
    # built-in receiver through the public URL (API_URL), which nginx forwards to the API.
    DEMO_ENABLED: ${DEMO_ENABLED:-false}
    DEMO_RECEIVER_ENABLED: ${DEMO_ENABLED:-false}
  networks: [internal]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: always
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/90-heimdall.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks: [internal]

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true

  api:
    <<: *backend
    ports:
      - "${APP_PORT:-8000}:8000" # API + web app
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  publisher:
    <<: *backend
    command: ["python", "-m", "app.workers.outbox_worker"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  worker:
    <<: *backend
    command: ["python", "-m", "app.workers.delivery_worker"]
    healthcheck:
      disable: true
    deploy:
      replicas: ${WORKER_REPLICAS:-2} # workers scale independently of the API
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq_data:

networks:
  internal:

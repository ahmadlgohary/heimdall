name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint, migrations, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: heimdall
          POSTGRES_PASSWORD: heimdall
          POSTGRES_DB: heimdall_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U heimdall"
          --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: heimdall
          RABBITMQ_DEFAULT_PASS: heimdall
          RABBITMQ_DEFAULT_VHOST: heimdall_test
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 10s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://heimdall:heimdall@localhost:5432/heimdall_test
      TEST_RABBITMQ_URL: amqp://heimdall:heimdall@localhost:5672/heimdall_test
      # fail instead of skipping if a service is unreachable
      CI_REQUIRE_SERVICES: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check . --output-format=github

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Migrations apply and match the models
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Import check
        run: uv run python -c "import app.main, app.workers.delivery_worker, app.workers.outbox_worker"

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=85

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend · lint, types, tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (mock API)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  stack:
    name: Docker stack · build and end-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Create .env
        run: make env

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Smoke test (frontend → API → RabbitMQ → worker → receiver)
        run: ./infrastructure/scripts/smoke-test.sh

      - name: Backend tests inside the container
        run: make test

      - name: Service status and logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  prod-config:
    name: Production compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.prod.yml
        run: |
          cp .env.example .env
          DATABASE_URL=postgresql://u:p@db.example/x JWT_SECRET=x ENCRYPTION_KEY=x \
            docker compose -f docker-compose.prod.yml config --quiet

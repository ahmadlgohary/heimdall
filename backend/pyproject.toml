[project]
name = "heimdall-backend"
version = "0.1.0"
description = "Heimdall API, outbox publisher and delivery worker"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=10.2.3",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "boto3>=1.44.1",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.2.5",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = [
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "S101",   # assert is fine in tests
  "RUF012",
  "RUF001",  # typographic apostrophes in user-facing messages are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S311"]
"app/dev/**" = ["S311"]
"app/scripts/**" = ["S311"]  # sample data, not security

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra"
markers = [
  "integration: needs PostgreSQL (and RabbitMQ for broker tests)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/dev/*"]

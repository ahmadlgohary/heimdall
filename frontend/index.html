<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b0f" />
    <meta name="description" content="Heimdall — register endpoints, deliver signed webhooks, and inspect every attempt." />
    <title>Heimdall</title>
    <script>
      try {
        var p = localStorage.getItem('heimdall.theme') || 'dark'
        var light = p === 'light' || (p === 'system' && matchMedia('(prefers-color-scheme: light)').matches)
        if (light) document.documentElement.classList.replace('dark', 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

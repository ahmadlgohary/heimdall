# Mounted read-only into the rabbitmq container.
listeners.tcp.default = 5672
management.tcp.port = 15672

# Persistent messages + durable queues live on the data volume; stop accepting
# publishes (publisher confirms then fail and the outbox retries) before the disk fills.
disk_free_limit.absolute = 1GB
vm_memory_high_watermark.relative = 0.6

# A delivery attempt takes at most ~10 s; anything unacked for 30 min is a stuck consumer.
consumer_timeout = 1800000

log.console = true
log.console.level = warning
